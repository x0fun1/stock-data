# Pinned toolchain for the Skill's Rust workspace.
#
# The Skill launcher (scripts/run.sh) exports RUSTUP_TOOLCHAIN=1.99.1 because
# `cargo --manifest-path` does not select a rustup toolchain by itself. The MSRV is
# declared in Cargo.toml (`workspace.package.rust-version = "1.99"`); the exact toolchain
# validated for this review is 1.99.1. `Cargo.lock` is committed and every build/test
# command runs with `--locked`.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
