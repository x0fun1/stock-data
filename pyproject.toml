[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-research-skill"
version = "0.5.0"
description = "US/HK evidence-first news, macro and company-message research skill"
requires-python = ">=3.12"
dependencies = ["requests>=2.31", "ddgs>=9,<10", "trafilatura>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]
legacy-import = ["pandas>=2.2", "pyarrow>=15"]

[tool.setuptools]
package-dir = {"" = "scripts"}
packages = ["stock_research"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"
