[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-research-skill"
version = "0.3.0"
description = "US/HK evidence-first quantitative and news research skill"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scipy>=1.11",
  "requests>=2.31",
  "lightgbm==4.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "scripts"}
packages = ["stock_research"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"
